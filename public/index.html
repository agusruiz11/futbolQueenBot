<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fútbol Queens — chat de prueba</title>
  <style>
    :root {
      --violeta: #6b2d8c;
      --violeta-claro: #f3e8f9;
      --borde: #e4e0e8;
      --texto: #2a2430;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--texto);
      background: #faf8fb;
      display: flex;
      justify-content: center;
    }
    main {
      width: min(560px, 100%);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-inline: 1px solid var(--borde);
    }
    header {
      padding: 14px 18px;
      background: var(--violeta);
      color: #fff;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; }
    header span { font-size: 12px; opacity: .75; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .globo {
      max-width: 78%;
      padding: 9px 13px;
      border-radius: 16px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .bot { align-self: flex-start; background: var(--violeta-claro); border-bottom-left-radius: 4px; }
    .yo { align-self: flex-end; background: var(--violeta); color: #fff; border-bottom-right-radius: 4px; }
    .escribiendo { align-self: flex-start; color: #8a8290; font-size: 13px; padding: 4px 13px; }
    form {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid var(--borde);
    }
    input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--borde);
      border-radius: 20px;
      font: inherit;
    }
    input:focus { outline: 2px solid var(--violeta); outline-offset: -1px; }
    button {
      padding: 10px 18px;
      border: 0;
      border-radius: 20px;
      background: var(--violeta);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Fútbol Queens</h1>
      <span>chat de prueba</span>
    </header>
    <div id="chat" aria-live="polite"></div>
    <form id="form">
      <input id="input" placeholder="Escribí un mensaje…" autocomplete="off" required>
      <button type="submit">Enviar</button>
    </form>
  </main>

  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const boton = form.querySelector('button');

    // Historial en el formato que espera la API
    const messages = [];

    function pintar(texto, clase) {
      const div = document.createElement('div');
      div.className = 'globo ' + clase;
      div.textContent = texto;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    const espera = (ms) => new Promise((r) => setTimeout(r, ms));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const texto = input.value.trim();
      if (!texto) return;

      pintar(texto, 'yo');
      messages.push({ role: 'user', content: texto });
      input.value = '';
      boton.disabled = true;

      const indicador = document.createElement('div');
      indicador.className = 'escribiendo';
      indicador.textContent = 'escribiendo…';
      chat.appendChild(indicador);
      chat.scrollTop = chat.scrollHeight;

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages }),
        });
        const data = await res.json();
        indicador.remove();

        const globos = data.messages || [data.error || 'Error inesperado'];
        // Los pintamos de a uno, como salen en Instagram
        for (const [i, globo] of globos.entries()) {
          if (i > 0) await espera(700);
          pintar(globo, 'bot');
        }
        messages.push({ role: 'assistant', content: globos.join('\n') });
      } catch (err) {
        indicador.remove();
        pintar('No pude conectar con el servidor: ' + err.message, 'bot');
      } finally {
        boton.disabled = false;
        input.focus();
      }
    });

    input.focus();
  </script>
</body>
</html>
